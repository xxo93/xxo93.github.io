<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 220" width="100%" role="img" aria-label="一行 user 数据的物理结构：用户可见列 id、name、age 之外，InnoDB 自动追加三个隐藏列 trx_id、roll_pointer、DB_ROW_ID">
        <defs>
          <marker id="arrow2-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#1e5fa8"/>
          </marker>
        </defs>
        <text x="400" y="28" text-anchor="middle" font-size="14" font-weight="bold" font-family="inherit" fill="#1f2937">磁盘上一行数据的真实长相（你在 SELECT 里看不到下面三个隐藏列）</text>
        
        <rect x="60" y="55" width="130" height="60" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="125" y="80" text-anchor="middle" font-size="13" font-family="inherit" fill="#6b7280">id</text>
        <text x="125" y="103" text-anchor="middle" font-size="14" font-family="inherit" fill="#1f2937">1</text>
        <rect x="200" y="55" width="160" height="60" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="280" y="80" text-anchor="middle" font-size="13" font-family="inherit" fill="#6b7280">name</text>
        <text x="280" y="103" text-anchor="middle" font-size="14" font-family="inherit" fill="#1f2937">张三</text>
        <rect x="370" y="55" width="130" height="60" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="435" y="80" text-anchor="middle" font-size="13" font-family="inherit" fill="#6b7280">age</text>
        <text x="435" y="103" text-anchor="middle" font-size="14" font-family="inherit" fill="#1f2937">20</text>
        
        <line x1="515" y1="50" x2="515" y2="180" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
        
        <rect x="530" y="55" width="110" height="60" rx="6" fill="#dbeafe" stroke="#1e5fa8" stroke-width="1.5"/>
        <text x="585" y="78" text-anchor="middle" font-size="12.5" font-family="inherit" fill="#1e5fa8">trx_id</text>
        <text x="585" y="100" text-anchor="middle" font-size="12.5" font-family="inherit" fill="#1f2937">300</text>
        <rect x="650" y="55" width="110" height="60" rx="6" fill="#dbeafe" stroke="#1e5fa8" stroke-width="1.5"/>
        <text x="705" y="78" text-anchor="middle" font-size="12.5" font-family="inherit" fill="#1e5fa8">roll_pointer</text>
        <text x="705" y="100" text-anchor="middle" font-size="12.5" font-family="inherit" fill="#1f2937">→ 旧版本</text>
        <rect x="590" y="130" width="110" height="50" rx="6" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
        <text x="645" y="150" text-anchor="middle" font-size="12" font-family="inherit" fill="#6b7280">DB_ROW_ID</text>
        <text x="645" y="169" text-anchor="middle" font-size="12" font-family="inherit" fill="#6b7280">0（无主键时自动生成）</text>
        
        <text x="280" y="140" text-anchor="middle" font-size="13" font-family="inherit" fill="#16a34a">你定义的列（用户可见）</text>
        <text x="645" y="205" text-anchor="middle" font-size="13" font-family="inherit" fill="#1e5fa8">InnoDB 自动追加的隐藏列（用户不可见）</text>
      </svg>