<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 320" width="100%" role="img" aria-label="RC 与 RR 下 ReadView 生成时机对比：RC 每次快照读都新建 ReadView，RR 首次生成后复用">
      <defs>
        <marker id="arrow3-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
        </marker>
      </defs>

      
      <text x="10" y="95" class="lane-label">RC</text>
      <text x="10" y="112" class="lane-label">读已提交</text>
      <text x="10" y="245" class="lane-label">RR</text>
      <text x="10" y="262" class="lane-label">可重复读</text>

      
      <rect x="70" y="70" width="78" height="40" rx="8" class="svg-box"/>
      <text x="109" y="94" text-anchor="middle" class="svg-text-b nowrap">T1 开始</text>

      <rect x="180" y="70" width="118" height="40" rx="8" class="box-blue"/>
      <text x="239" y="94" text-anchor="middle" class="svg-text-b nowrap">SELECT① age=30</text>

      <rect x="335" y="70" width="130" height="40" rx="8" class="svg-box"/>
      <text x="400" y="88" text-anchor="middle" class="svg-text-b nowrap">T2 UPDATE 李四</text>
      <text x="400" y="103" text-anchor="middle" class="svg-text nowrap">age 30→35 并提交</text>

      <rect x="505" y="70" width="118" height="40" rx="8" class="box-blue"/>
      <text x="564" y="94" text-anchor="middle" class="svg-text-b nowrap">SELECT② age=35</text>

      <rect x="655" y="70" width="130" height="40" rx="8" class="box-amber"/>
      <text x="720" y="88" text-anchor="middle" class="svg-text-b nowrap">两次结果不同</text>
      <text x="720" y="103" text-anchor="middle" class="svg-text nowrap">不可重复读</text>

      
      <line x1="148" y1="90" x2="176" y2="90" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow3-1)"/>
      <line x1="298" y1="90" x2="331" y2="90" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow3-1)"/>
      <line x1="465" y1="90" x2="501" y2="90" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow3-1)"/>
      <line x1="623" y1="90" x2="651" y2="90" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow3-1)"/>

      
      <text x="239" y="130" text-anchor="middle" class="svg-text-b" fill="#d97706">新建 ReadView A</text>
      <line x1="239" y1="118" x2="239" y2="110" stroke="#d97706" stroke-width="1.5"/>
      <text x="564" y="130" text-anchor="middle" class="svg-text-b" fill="#d97706">又新建 ReadView B</text>
      <line x1="564" y1="118" x2="564" y2="110" stroke="#d97706" stroke-width="1.5"/>

      
      <line x1="20" y1="160" x2="780" y2="160" stroke="#e5e7eb" stroke-width="1.5"/>

      
      <rect x="70" y="220" width="78" height="40" rx="8" class="svg-box"/>
      <text x="109" y="244" text-anchor="middle" class="svg-text-b nowrap">T1 开始</text>

      <rect x="180" y="220" width="118" height="40" rx="8" class="box-blue"/>
      <text x="239" y="244" text-anchor="middle" class="svg-text-b nowrap">SELECT① age=30</text>

      <rect x="335" y="220" width="130" height="40" rx="8" class="svg-box"/>
      <text x="400" y="238" text-anchor="middle" class="svg-text-b nowrap">T2 UPDATE 李四</text>
      <text x="400" y="253" text-anchor="middle" class="svg-text nowrap">age 30→35 并提交</text>

      <rect x="505" y="220" width="118" height="40" rx="8" class="box-blue"/>
      <text x="564" y="244" text-anchor="middle" class="svg-text-b nowrap">SELECT② age=30</text>

      <rect x="655" y="220" width="130" height="40" rx="8" class="box-green"/>
      <text x="720" y="238" text-anchor="middle" class="svg-text-b nowrap">两次结果相同</text>
      <text x="720" y="253" text-anchor="middle" class="svg-text nowrap">可重复读</text>

      
      <line x1="148" y1="240" x2="176" y2="240" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow3-1)"/>
      <line x1="298" y1="240" x2="331" y2="240" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow3-1)"/>
      <line x1="465" y1="240" x2="501" y2="240" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow3-1)"/>
      <line x1="623" y1="240" x2="651" y2="240" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow3-1)"/>

      
      <text x="239" y="285" text-anchor="middle" class="svg-text-b" fill="#d97706">新建 ReadView A</text>
      <line x1="239" y1="273" x2="239" y2="260" stroke="#d97706" stroke-width="1.5"/>
      <text x="564" y="285" text-anchor="middle" class="svg-text-b" fill="#16a34a">复用 ReadView A（看不到 T2）</text>
      <line x1="564" y1="273" x2="564" y2="260" stroke="#16a34a" stroke-width="1.5"/>
    </svg>