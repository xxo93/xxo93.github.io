<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 460" width="100%" role="img" aria-label="可见性判断决策流程图：依次比较 trx_id 与 creator_trx_id、min_trx_id、max_trx_id、m_ids，不可见则沿版本链找旧版本">
        <defs>
          <marker id="arrow2-4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#1e5fa8"/>
          </marker>
        </defs>

        
        <rect x="300" y="10" width="200" height="36" rx="18" fill="#dbeafe" stroke="#1e5fa8" stroke-width="1.5"/>
        <text x="400" y="33" text-anchor="middle" font-size="13" font-family="inherit" fill="#1e5fa8">取当前行的 trx_id</text>

        
        <polygon points="400,68 520,100 400,132 280,100" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="400" y="104" text-anchor="middle" font-size="12.5" font-family="inherit" fill="#1f2937">trx_id == creator_trx_id ?</text>
        <line x1="400" y1="46" x2="400" y2="66" stroke="#1e5fa8" stroke-width="1.5" marker-end="url(#arrow2-4)"/>

        
        <line x1="520" y1="100" x2="600" y2="100" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow2-4)"/>
        <text x="560" y="92" text-anchor="middle" font-size="12" font-family="inherit" fill="#16a34a">是</text>
        <rect x="600" y="80" width="150" height="40" rx="10" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
        <text x="675" y="105" text-anchor="middle" font-size="13" font-weight="bold" font-family="inherit" fill="#065f46">✓ 可见</text>

        
        <line x1="400" y1="132" x2="400" y2="158" stroke="#1e5fa8" stroke-width="1.5" marker-end="url(#arrow2-4)"/>
        <text x="415" y="148" font-size="11" font-family="inherit" fill="#6b7280">否</text>
        <polygon points="400,158 520,190 400,222 280,190" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="400" y="194" text-anchor="middle" font-size="12.5" font-family="inherit" fill="#1f2937">trx_id &lt; min_trx_id ?</text>

        <line x1="520" y1="190" x2="600" y2="190" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow2-4)"/>
        <text x="560" y="182" text-anchor="middle" font-size="12" font-family="inherit" fill="#16a34a">是</text>
        <rect x="600" y="170" width="150" height="40" rx="10" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
        <text x="675" y="195" text-anchor="middle" font-size="13" font-weight="bold" font-family="inherit" fill="#065f46">✓ 可见</text>

        
        <line x1="400" y1="222" x2="400" y2="248" stroke="#1e5fa8" stroke-width="1.5" marker-end="url(#arrow2-4)"/>
        <text x="415" y="238" font-size="11" font-family="inherit" fill="#6b7280">否</text>
        <polygon points="400,248 520,280 400,312 280,280" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="400" y="284" text-anchor="middle" font-size="12.5" font-family="inherit" fill="#1f2937">trx_id &gt;= max_trx_id ?</text>

        <line x1="520" y1="280" x2="600" y2="280" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow2-4)"/>
        <text x="560" y="272" text-anchor="middle" font-size="12" font-family="inherit" fill="#dc2626">是</text>
        <rect x="600" y="260" width="150" height="40" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
        <text x="675" y="285" text-anchor="middle" font-size="13" font-weight="bold" font-family="inherit" fill="#991b1b">✗ 不可见</text>

        
        <line x1="400" y1="312" x2="400" y2="338" stroke="#1e5fa8" stroke-width="1.5" marker-end="url(#arrow2-4)"/>
        <text x="415" y="328" font-size="11" font-family="inherit" fill="#6b7280">否</text>
        <polygon points="400,338 520,370 400,402 280,370" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="400" y="374" text-anchor="middle" font-size="12.5" font-family="inherit" fill="#1f2937">trx_id 在 m_ids 中 ?</text>

        
        <line x1="280" y1="370" x2="200" y2="370" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow2-4)"/>
        <text x="240" y="362" text-anchor="middle" font-size="12" font-family="inherit" fill="#dc2626">是</text>
        <rect x="50" y="350" width="150" height="40" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
        <text x="125" y="375" text-anchor="middle" font-size="13" font-weight="bold" font-family="inherit" fill="#991b1b">✗ 不可见</text>

        
        <line x1="520" y1="370" x2="600" y2="370" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow2-4)"/>
        <text x="560" y="362" text-anchor="middle" font-size="12" font-family="inherit" fill="#16a34a">否</text>
        <rect x="600" y="350" width="150" height="40" rx="10" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
        <text x="675" y="375" text-anchor="middle" font-size="13" font-weight="bold" font-family="inherit" fill="#065f46">✓ 可见</text>

        
        <path d="M 125 390 L 125 430 L 400 430 L 400 46" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow2-4)"/>
        <text x="250" y="448" font-size="12" font-family="inherit" fill="#dc2626">不可见：沿 roll_pointer 找下一个旧版本，回到顶部重新判断</text>
      </svg>