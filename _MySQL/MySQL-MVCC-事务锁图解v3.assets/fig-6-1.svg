<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 430" role="img" aria-label="MySQL 并发控制知识地图：中心为并发控制，四大分支为事务、MVCC、锁体系、关联" width="100%">
        <defs>
          <marker id="arrow6-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
          </marker>
        </defs>

        
        <rect x="320" y="188" width="160" height="52" rx="12" fill="#dbeafe" stroke="#1e5fa8" stroke-width="1.8"/>
        <text x="400" y="220" text-anchor="middle" font-family="inherit" font-size="15" font-weight="bold" fill="#1e3a8a">MySQL 并发控制</text>

        
        <rect x="30" y="20" width="230" height="130" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="50" y="44" font-family="inherit" font-size="13.5" font-weight="bold" fill="#1e5fa8">① 事务</text>
        <text x="50" y="68" font-family="inherit" font-size="12.5" fill="#1f2937">ACID（原子/一致/隔离/持久）</text>
        <text x="50" y="90" font-family="inherit" font-size="12.5" fill="#1f2937">RU / RC / RR / 串行化</text>
        <text x="50" y="112" font-family="inherit" font-size="12.5" fill="#1f2937">脏读 / 不可重复读 / 幻读</text>
        <text x="50" y="134" font-family="inherit" font-size="12.5" fill="#1f2937">隔离性 = 锁 + MVCC</text>

        
        <rect x="540" y="20" width="230" height="130" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="560" y="44" font-family="inherit" font-size="13.5" font-weight="bold" fill="#0d9488">② MVCC 多版本并发控制</text>
        <text x="560" y="68" font-family="inherit" font-size="12.5" fill="#1f2937">隐藏列 trx_id / roll_pointer</text>
        <text x="560" y="90" font-family="inherit" font-size="12.5" fill="#1f2937">undo log 版本链</text>
        <text x="560" y="112" font-family="inherit" font-size="12.5" fill="#1f2937">ReadView 四字段·可见性判断</text>
        <text x="560" y="134" font-family="inherit" font-size="12.5" fill="#1f2937">RC 每次新建 / RR 首次复用</text>

        
        <rect x="30" y="280" width="230" height="130" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="50" y="304" font-family="inherit" font-size="13.5" font-weight="bold" fill="#dc2626">③ 锁体系</text>
        <text x="50" y="328" font-family="inherit" font-size="12.5" fill="#1f2937">表锁 / 行锁（基于索引实现）</text>
        <text x="50" y="350" font-family="inherit" font-size="12.5" fill="#1f2937">S 共享锁 / X 排他锁</text>
        <text x="50" y="372" font-family="inherit" font-size="12.5" fill="#1f2937">Record / Gap / Next-Key</text>
        <text x="50" y="394" font-family="inherit" font-size="12.5" fill="#1f2937">意向锁 IS / IX（门口告示牌）</text>

        
        <rect x="540" y="280" width="230" height="130" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
        <text x="560" y="304" font-family="inherit" font-size="13.5" font-weight="bold" fill="#78350f">④ 关联（本页核心）</text>
        <text x="560" y="328" font-family="inherit" font-size="12.5" fill="#1f2937">快照读 = MVCC 无锁</text>
        <text x="560" y="350" font-family="inherit" font-size="12.5" fill="#1f2937">当前读 = 锁 + 最新已提交版本</text>
        <text x="560" y="372" font-family="inherit" font-size="12.5" fill="#1f2937">幻读双保险：MVCC + Next-Key</text>
        <text x="560" y="394" font-family="inherit" font-size="12.5" fill="#1f2937">MVCC 不覆盖当前读</text>

        
        <line x1="360" y1="188" x2="200" y2="152" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow6-1)"/>
        <line x1="440" y1="188" x2="600" y2="152" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow6-1)"/>
        <line x1="360" y1="240" x2="200" y2="278" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow6-1)"/>
        <line x1="440" y1="240" x2="600" y2="278" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow6-1)"/>
      </svg>